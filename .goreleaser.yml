version: 2

project_name: vistan

builds:
  - id: vistan
    main: ./cmd/vistan
    binary: vistan
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/zovaris/vistan/internal/vistan.version={{ .Version }}
    # No windows yet: the server uses syscall.Kill and SysProcAttr.Setsid.
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - INSTRUCTIONS.md

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^style:"
      - Merge pull request
      - Merge branch

release:
  name_template: "Vistan {{ .Version }}"
  prerelease: auto
  footer: |
    Install with `curl -fsSL https://raw.githubusercontent.com/zovaris/vistan/main/install.sh | sh`,
    or `go install github.com/zovaris/vistan/cmd/vistan@{{ .Tag }}`, or unpack the archive for
    your platform and move `vistan` into your PATH.
