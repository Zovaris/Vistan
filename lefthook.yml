# lefthook install links these into .git/hooks: gofmt on commit, the four checks on
# push. CI runs the same four.

pre-commit:
  jobs:
    - name: gofmt
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: gofmt
      glob: "*.go"
      run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
    - name: vet
      run: go vet ./...
    - name: lint
      run: golangci-lint run ./...
    - name: test
      run: go test ./...
